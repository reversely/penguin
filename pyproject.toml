[project]
name = "penguin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "libcst==1.9.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
# Each fixture under examples/ is a separate repository with its own pytest root; the repo's suite
# builds it and runs its tests from there. Its checkpoint tests fail on purpose once merged, so the
# repo's suite never collects them, even when a run names a path above the fixture. The list keeps
# pytest's default norecursedirs; --ignore would resolve against the caller's working directory.
testpaths = ["tests"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "identity-unification",
    "helpful-fix",
    "dependency-bump",
    "money-minor-units",
]
addopts = ["--strict-markers"]
markers = ["slow: long-running fixture reproductions; excluded from the fast suite"]
