# Mechanical, deterministic checks only. Judgment calls (data-structure fit, module boundaries,
# whether a complex change explains itself) aren't enforceable here; see the clean-code skill.
#
# Setup in a new repo:
#   uv add --dev pre-commit detect-secrets "ruff==<the rev below, without the v>"
#   uv run pre-commit install
#   uv run detect-secrets scan > .secrets.baseline
#
# Pin the dev ruff to the hook's rev so `uv run ruff` and the hook apply the same rules; a ruff
# from outside the project can sort imports differently and undo the hook's fixes.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
